name: Panache CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Security Check - No secret env files in repo
        run: |
          if git ls-files | grep -E '\.env(\.local|\.production|\.development)?$' | grep -v '\.env\.example'; then
            echo "::error::Found committed environment files with secrets! Only .env.example should be tracked."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test gate
        run: pnpm test

      - name: Run production build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          VITE_RESORT_ID: 00000000-0000-0000-0000-000000000001
        run: pnpm build
